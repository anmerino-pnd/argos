services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: argos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: argos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argos_dev}
      POSTGRES_DB: argos
    ports:
      - "5432:5432"
    volumes:
      - argos_pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argos -d argos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  argos_pgdata: